# Coolify: Resource -> Docker Compose -> "Docker Compose Location": /coolify.compose.yaml
# Domena: Coolify wstrzykuje SERVICE_FQDN_WEB (port 3000) i konfiguruje proxy (Traefik/Caddy).
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_WEB_3000
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
